[project]
name = "mcp-claude-1c"
version = "0.1.0"
description = "Telegram bot with 1C/BAS access via MCP + FastAPI"
requires-python = ">=3.11"

dependencies = [
    "aiogram>=3.10",
    "anthropic>=0.30",
    "groq>=0.9",
    "mcp>=1.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
